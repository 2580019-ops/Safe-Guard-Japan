<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b132b"/>
      <stop offset="50%" stop-color="#1c2541"/>
      <stop offset="100%" stop-color="#0b132b"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#b91c1c"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#ef4444" flood-opacity="0.5"/>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="104" fill="url(#bg)"/>
  
  <!-- Outer subtle radar circles -->
  <circle cx="256" cy="245" r="190" stroke="#3b82f6" stroke-width="2" stroke-opacity="0.25" fill="none" stroke-dasharray="8 8"/>
  <circle cx="256" cy="245" r="140" stroke="#3b82f6" stroke-width="2" stroke-opacity="0.35" fill="none"/>

  <!-- Shield shape -->
  <path d="M 256 95 L 375 145 C 375 270 256 365 256 365 C 256 365 137 270 137 145 Z" 
        fill="url(#shieldGrad)" 
        filter="url(#glow)"
        stroke="#ffffff" 
        stroke-width="6"/>

  <!-- Inner Japanese Sun symbol / Life ring -->
  <circle cx="256" cy="225" r="48" fill="#ffffff" stroke="#fee2e2" stroke-width="4"/>
  <circle cx="256" cy="225" r="32" fill="#ef4444"/>

  <!-- Emergency Pulses / Waves above shield -->
  <path d="M 216 170 Q 256 150 296 170" stroke="#ffffff" stroke-width="6" stroke-linecap="round" fill="none"/>
  
  <!-- Text Label -->
  <text x="256" y="440" font-family="system-ui, -apple-system, sans-serif" font-size="34" font-weight="900" fill="#f8fafc" text-anchor="middle" letter-spacing="3">SAFEGUARD JP</text>
  <text x="256" y="475" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="600" fill="#94a3b8" text-anchor="middle" letter-spacing="1">防災ポータル</text>
</svg>
