# SafeGuard Japan - Spring Boot Configuration
server.port=8080

# MariaDB Datasource (Read-only application user recommended in production)
spring.datasource.url=jdbc:mariadb://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:safeguard_db}?useUnicode=true&characterEncoding=UTF-8
spring.datasource.username=${DB_USER:safeguard_app}
spring.datasource.password=${DB_PASSWORD:safeguard_secret_pass}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# MyBatis Configuration
mybatis.mapper-locations=classpath:mapper/*.xml
mybatis.type-aliases-package=com.safeguardjapan.model
mybatis.configuration.map-underscore-to-camel-case=true

# Spring Cache with Caffeine (60-second TTL for disaster alert caching)
spring.cache.type=caffeine
spring.cache.cache-names=jmaAlertCache
spring.cache.caffeine.spec=maximumSize=100,expireAfterWrite=60s

# Internationalization & Messages
spring.messages.basename=messages
spring.messages.encoding=UTF-8
spring.messages.fallback-to-system-locale=false

# Thymeleaf Configuration
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.cache=false

# JMA Client Configuration
jma.api.quake-url=https://www.jma.go.jp/bosai/quake/data/list.json
jma.api.timeout-seconds=3
